---
apiVersion: v1
kind: Service
metadata:
  name: jetty12
  namespace: jetty
  labels:
    app: jetty12
spec:
  type: NodePort
  ports:
    - port: 8080
      targetPort: 8080
      name: http
    - port: 8443
      targetPort: 8443
      name: https
    - port: 1099
      targetPort: 1099
      nodePort: 1099
      name: jmx
  selector:
    app: jetty12
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: jetty12
  namespace: jetty
  labels:
    app: jetty12
spec:
  serviceName: jetty12
  replicas: 1
  selector:
    matchLabels:
      app: jetty12
  template:
    metadata:
      labels:
        app: jetty12
    spec:
      containers:
        - name: jetty12
          securityContext:
            privileged: true
          image: jetty:12.0
          ports:
            - containerPort: 8080
            - containerPort: 8443
            - containerPort: 1099
          env:
            - name: JAVA_OPTIONS
              value: "-Dcom.sun.management.jmxremote=true -Dcom.sun.management.jmxremote.port=1099 -Dcom.sun.management.jmxremote.rmi.port=1099 -Djava.rmi.server.hostname=10.10.90.114 -Dcom.sun.management.jmxremote.ssl=false -Dcom.sun.management.jmxremote.authenticate=false"
          args:
            - "--module=jmx"
