---
apiVersion: v1
kind: Service
metadata:
  name: weblogic-10-3-6-0
  namespace: weblogic
  labels:
    app: weblogic-10-3-6-0
spec:
  type: NodePort
  ports:
    - port: 9999
      targetPort: 9999
      nodePort: 9999
      name: jmx
    - port: 7002
      targetPort: 7001
      name: web
  selector:
    app: weblogic-10-3-6-0
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: weblogic-10-3-6-0
  namespace: weblogic
  labels:
    app: weblogic-10-3-6-0
spec:
  serviceName: weblogic-10-3-6-0
  replicas: 1
  selector:
    matchLabels:
      app: weblogic-10-3-6-0
  template:
    metadata:
      labels:
        app: weblogic-10-3-6-0
    spec:
      containers:
        - name: weblogic-10-3-6-0
          image: registry-svc:25000/library/vulhub/weblogic:10.3.6.0-2017
          securityContext:
            privileged: true
          ports:
            - containerPort: 7001
            - containerPort: 9999
          env:
            - name: JAVA_OPTIONS
              value: "-Dcom.sun.management.jmxremote=true -Dcom.sun.management.jmxremote.port=9999 -Dcom.sun.management.jmxremote.rmi.port=9999 -Dcom.sun.management.jmxremote.ssl=false -Dcom.sun.management.jmxremote.authenticate=false"
