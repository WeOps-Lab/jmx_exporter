---
apiVersion: v1
kind: Service
metadata:
  name: weblogic-10-3-6-0
  namespace: weblogic
  labels:
    app: weblogic-10-3-6-0
spec:
  type: NodePort
  ports:
    - port: 7001
      name: server
      targetPort: 7001
      nodePort: 7002
    - port: 1097
      targetPort: 1097
      nodePort: 1097
      name: jmx
  selector:
    app: weblogic-10-3-6-0
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: weblogic-10-3-6-0
  namespace: weblogic
  labels:
    app: weblogic-10-3-6-0
spec:
  serviceName: weblogic-10-3-6-0
  replicas: 1
  selector:
    matchLabels:
      app: weblogic-10-3-6-0
  template:
    metadata:
      labels:
        app: weblogic-10-3-6-0
    spec:
      containers:
        - name: weblogic-10-3-6-0
          image: registry-svc:25000/library/vulhub/weblogic:10.3.6.0-2017
          securityContext:
            privileged: true
          ports:
            - containerPort: 7001
            - containerPort: 1097
          env:
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: status.hostIP
            - name: JAVA_OPTIONS
              value: "-Dcom.sun.management.jmxremote=true -Dcom.sun.management.jmxremote.port=1097 -Dcom.sun.management.jmxremote.rmi.port=1097 -Dcom.sun.management.jmxremote.ssl=false -Dcom.sun.management.jmxremote.authenticate=false -Djavax.management.builder.initial=weblogic.management.jmx.mbeanserver.WLSMBeanServerBuilder -Djava.rmi.server.hostname=$(NODE_IP)"

