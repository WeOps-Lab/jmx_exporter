username: {{ username }}
password: {{ password }}
jmxUrl: {{ jmx_url }}
ssl: false
startDelaySeconds: 0
lowercaseOutputName: true
lowercaseOutputLabelNames: true
rules:
  - pattern: 'Catalina<type=Server><>serverInfo: (.+)'
    name: tomcat_serverinfo
    value: 1
    labels:
      serverInfo: "$1"
    type: COUNTER
  - pattern: 'Catalina<type=GlobalRequestProcessor, name=\"([\w-]+)-(\d+)\"><>(\w+):'
    name: tomcat_$3_total
    labels:
      port: "$2"
      protocol_type: "$1"
    help: Tomcat global $3
    type: COUNTER
  - pattern: 'Catalina<j2eeType=Servlet, WebModule=//([-a-zA-Z0-9+&@#/%?=~_|!:.,;]*[-a-zA-Z0-9+&@#/%=~_|]), name=([-a-zA-Z0-9+/$%~_-|!.]*), J2EEApplication=none, J2EEServer=none><>(requestCount|processingTime|errorCount):'
    name: tomcat_servlet_$3_total
    labels:
      module: "$1"
      servlet: "$2"
    help: Tomcat servlet $3 total
    type: COUNTER
  - pattern: 'Catalina<type=ThreadPool, name="([\w-]+)-(\d+)"><>(currentThreadCount|currentThreadsBusy|keepAliveCount|connectionCount|acceptCount|acceptorThreadCount|pollerThreadCount|maxThreads|minSpareThreads):'
    name: tomcat_threadpool_$3
    labels:
      port: "$2"
      protocol_type: "$1"
    help: Tomcat threadpool $3
    type: GAUGE

  # Spring Boot 内嵌 Tomcat MBean（需启用 server.tomcat.mbeanregistry.enabled）
  # tomcat_threadpool_maxthreads：最大线程数
  - pattern: 'Tomcat<name="([\w-]+)-(\d+)", type=ThreadPool><>maxThreads'
    name: tomcat_threadpool_maxthreads
    labels:
      port: "$2"
      protocol_type: "$1"
    type: GAUGE
  # tomcat_threadpool_currentthreadsbusy：当前忙线程数
  - pattern: 'Tomcat<name="([\w-]+)-(\d+)", type=ThreadPool><>currentThreadsBusy'
    name: tomcat_threadpool_currentthreadsbusy
    labels:
      port: "$2"
      protocol_type: "$1"
    type: GAUGE
  # tomcat_threadpool_currentthreadcount：当前已创建线程数
  - pattern: 'Tomcat<name="([\w-]+)-(\d+)", type=ThreadPool><>currentThreadCount'
    name: tomcat_threadpool_currentthreadcount
    labels:
      port: "$2"
      protocol_type: "$1"
    type: GAUGE
  - pattern: 'Catalina<type=Manager, host=([-a-zA-Z0-9+&@#/%?=~_|!:.,;]*[-a-zA-Z0-9+&@#/%=~_|]), context=([-a-zA-Z0-9+/$%~_-|!.]*)><>(processingTime|sessionCounter|rejectedSessions|expiredSessions):'
    name: tomcat_session_$3_total
    labels:
      context: "$2"
      host: "$1"
    help: Tomcat session $3 total
    type: COUNTER

  # tomcat6适配
  - pattern: 'Catalina<type=GlobalRequestProcessor, name=(\w+)-(\d+)><>(\w+):'
    name: tomcat_$3_total
    labels:
      port: "$2"
      protocol_type: "$1"
    help: Tomcat global $3
    type: COUNTER

  - pattern: 'Catalina<type=ThreadPool, name=(\w+)-(\d+)><>(running|currentThreadCount|currentThreadsBusy|maxThreads):'
    name: tomcat_threadpool_$3
    labels:
      port: "$2"
      protocol_type: "$1"
    help: Tomcat threadpool $3
    type: GAUGE

  - pattern: 'Catalina<type=Manager, path=/([-a-zA-Z0-9+&@#/%?=~_|!:.,;]*[-a-zA-Z0-9+&@#/%=~_|]), host=([-a-zA-Z0-9+&@#/%?=~_|!:.,;]*[-a-zA-Z0-9+&@#/%=~_|])><>(processingTime|sessionCounter|rejectedSessions|expiredSessions):'
    name: tomcat_session_$3_total
    labels:
      context: "$2"
      host: "$1"
    help: Tomcat session $3 total
    type: COUNTER
