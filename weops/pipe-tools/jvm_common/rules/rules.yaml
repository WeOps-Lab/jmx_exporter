groups:
- name: jvm_common_metrics
  rules:
  # JVM 堆内存使用率 (%)
  - record: jvm_memory_heap_usage_percent
    expr: label_replace(
      100 * jvm_memory_usage_used{type="Heap"} / jvm_memory_usage_max{type="Heap"},
      "protocol", "vector", "", ""
      )

  # JVM 非堆已提交内存使用率 (%)
  - record: jvm_memory_nonheap_usage_percent
    expr: label_replace(
      100 * jvm_memory_usage_used{type="NonHeap"} / jvm_memory_usage_committed{type="NonHeap"},
      "protocol", "vector", "", ""
      )
